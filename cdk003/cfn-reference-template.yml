#----------------------------------------------------------------------
Description:
 Contains
 1 VPC;
 4 subnets (2 public, 2 private);
 3 route tables (1 for pub, 1 per each pvt subnets);
 1 internet gateway (route in pub route table);
 2 NAT gateways (routes in pvt route tables);
 2 NACLs (1 for pub, 1 for pvt subnets);
 2 security groups (ECS Task Definition, ELB ECS Service);
 1 application ELB + TargetGroups/Listeners;
 1 ECS Cluster + Service/Task Definition;
 2 S3 buckets (Code Services Artifacts, CloudTrail logs)
 1 S3 bucket policy (for bucket CloudTrail logs)
 1 EventBridge Rule for Code Services to monitor bucket artifacts for new version of source code
 1 CloudTrail enabling object-level data logging events for the S3 artifact bucket, allowing EventBridge to capture them
 1 CodePipeline for app/container (source reading from S3 + CodeBuild + deploy target to ECS);
 5 IAM roles (CodePipeline, CodeBuild, ECS Task Definition Execution, ECS Task Definition, EventBridge Target);
 By default VPC deploys 1 NACL and 1 SecGroup not reachable for changes by CloudFormation

#----------------------------------------------------------------------
#Metadata to define presentation of input parameters (AWS console interface)
#----------------------------------------------------------------------
Metadata:

  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "General Configuration"
        Parameters:
          - EnvironmentName
          - EnvType
      - Label:
          default: "Source Code and Container Configuration"
        Parameters:
          - SourceCodeS3Key
          - ContainerName
      - Label:
          default: "Network Configuration"
        Parameters:
          - VpcCIDR
          - PublicSubnet1CIDR
          - PublicSubnet2CIDR
          - PrivateSubnet1CIDR
          - PrivateSubnet2CIDR
          - Ip4ServerConnection
    ParameterLabels:
      EnvironmentName:
        default: Environment Name
      EnvType:
        default: Environment Type
      SourceCodeS3Key:
        default: Filename of zipped code to be uploaded to S3
      ContainerName:
        default: Container name
      VpcCIDR: 
        default: VPC IP range
      PublicSubnet1CIDR:
        default: First Public Subnet VPC IP range
      PublicSubnet2CIDR:
        default: Second Public Subnet VPC IP range
      PrivateSubnet1CIDR:
        default: First Private Subnet VPC IP range
      PrivateSubnet2CIDR:
        default: Second Private Subnet VPC IP range
      Ip4ServerConnection:
        default: IP address (or range) for connection to public servers

#----------------------------------------------------------------------
#Input parameters (information from user)
#----------------------------------------------------------------------
Parameters:

  EnvironmentName:
    Description: Enter an environment name to be prefixed to tag 'Name' of resources (no spaces, max size 15, lowercase)
    Type: String
    Default: cdk003
    AllowedPattern: ^((?:[0-9a-z-])+) #^\S+$
    MaxLength: 15
    ConstraintDescription: lowercase alphanumeric and hyphens, not empty, no spaces, max 15 chars

  EnvType: 
    Description: Choose environment type (used to turn on/off some in/outbound rules of NACLs/SecGroups)
    Type: String
    AllowedValues:
      - Production
      - Maintenance
    Default: Maintenance
    ConstraintDescription: must specify one of the options

  SourceCodeS3Key:
    Description:  Enter the name of the zip file containing the source code to be manually uploaded to S3
    Type: String
    Default: code.zip
    AllowedPattern: ^\S+$
    ConstraintDescription: cannot have spaces neither be empty

  ContainerName:
    Description:  Enter the container name
    Type: String
    Default: restapi
    AllowedPattern: ^\S+$
    ConstraintDescription: cannot have spaces neither be empty

  VpcCIDR:
    Description: Enter the IP range (CIDR notation) for VPC
    Type: String
    Default: 10.10.0.0/16
    AllowedPattern: ^((?:[0-9]{1,3}\.){3}[0-9]{1,3})(\/[0-9]{1,2}){1}$
    ConstraintDescription: must be a valid CIDR range

  PublicSubnet1CIDR:
    Description: Enter the IP range (CIDR notation) for the first public subnet
    Type: String
    Default: 10.10.10.0/24
    AllowedPattern: ^((?:[0-9]{1,3}\.){3}[0-9]{1,3})(\/[0-9]{1,2}){1}$
    ConstraintDescription: must be a valid CIDR range

  PublicSubnet2CIDR:
    Description: Enter the IP range (CIDR notation) for the second public subnet
    Type: String
    Default: 10.10.11.0/24
    AllowedPattern: ^((?:[0-9]{1,3}\.){3}[0-9]{1,3})(\/[0-9]{1,2}){1}$
    ConstraintDescription: must be a valid CIDR range

  PrivateSubnet1CIDR:
    Description: Enter the IP range (CIDR notation) for the first private subnet
    Type: String
    Default: 10.10.20.0/24
    AllowedPattern: ^((?:[0-9]{1,3}\.){3}[0-9]{1,3})(\/[0-9]{1,2}){1}$
    ConstraintDescription: must be a valid CIDR range

  PrivateSubnet2CIDR:
    Description: Enter the IP range (CIDR notation) for the second private subnet
    Type: String
    Default: 10.10.21.0/24
    AllowedPattern: ^((?:[0-9]{1,3}\.){3}[0-9]{1,3})(\/[0-9]{1,2}){1}$
    ConstraintDescription: must be a valid CIDR range

  Ip4ServerConnection:
    Description: Enter the IP address (or CIDR range) for connections SSH/RDP/ICMP to public servers
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: ^((?:[0-9]{1,3}\.){3}[0-9]{1,3})(\/[0-9]{1,2}){0,1}$
    ConstraintDescription: must be an IP or CIDR range

#----------------------------------------------------------------------
#Conditions for resource configuration
#----------------------------------------------------------------------
Conditions:

  IsEnvMaintenance: !Equals [ !Ref EnvType, Maintenance ] #Used to turn on/off some in/outbound rules of NACLs/SecGroups (via update stack)

#----------------------------------------------------------------------
#Resources definition
#----------------------------------------------------------------------
Transform: AWS::LanguageExtensions #required to use Fn::ToJsonString
Resources:

  # VPC #############################################################################
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCIDR
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-vpc

  # Public and Private Subnets ------------------------------------------------------
  SubnetPub1:
    Type: AWS::EC2::Subnet
    DependsOn: VPC
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [ 0, !GetAZs '' ]   #Selects 1st AZ of current zone
      CidrBlock: !Ref PublicSubnet1CIDR
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-subnet-pub1

  SubnetPub2:
    Type: AWS::EC2::Subnet
    DependsOn: VPC    
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [ 1, !GetAZs  '' ]   #Selects 2nd AZ of current zone
      CidrBlock: !Ref PublicSubnet2CIDR
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-subnet-pub2

  SubnetPvt1:
    Type: AWS::EC2::Subnet
    DependsOn: VPC    
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [ 0, !GetAZs  '' ]   #Selects 1st AZ of current zone
      CidrBlock: !Ref PrivateSubnet1CIDR
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-subnet-pvt1

  SubnetPvt2:
    Type: AWS::EC2::Subnet
    DependsOn: VPC    
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [ 1, !GetAZs  '' ]   #Selects 2nd AZ of current zone
      CidrBlock: !Ref PrivateSubnet2CIDR
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-subnet-pvt2

  # Internet Gateway ----------------------------------------------------------------
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-igw

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    DependsOn:
      - VPC
      - InternetGateway
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref VPC

  # NAT Gateways --------------------------------------------------------------------
  NatGateway1EIP:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-eip-nat1

  NatGateway1:
    Type: AWS::EC2::NatGateway
    DependsOn:
      - NatGateway1EIP
      - SubnetPub1
    Properties:
      AllocationId: !GetAtt NatGateway1EIP.AllocationId
      SubnetId: !Ref SubnetPub1
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-nat1

  NatGateway2EIP:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-eip-nat2

  NatGateway2:
    Type: AWS::EC2::NatGateway
    DependsOn:
      - NatGateway2EIP
      - SubnetPub2
    Properties:
      AllocationId: !GetAtt NatGateway2EIP.AllocationId
      SubnetId: !Ref SubnetPub2
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-nat2

  # Public Route Table --------------------------------------------------------------
  RouteTablePub:
    Type: AWS::EC2::RouteTable
    DependsOn: VPC
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-rtb-pub
    
  RouteTablePubRouteA: #Internet traffic using Internet Gateway
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTablePub
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  RouteTablePubAssociation2SubnetPub1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    DependsOn:
      - RouteTablePub
      - SubnetPub1
    Properties:
      RouteTableId: !Ref RouteTablePub
      SubnetId: !Ref SubnetPub1

  RouteTablePubAssociation2SubnetPub2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    DependsOn:
      - RouteTablePub
      - SubnetPub2
    Properties:
      RouteTableId: !Ref RouteTablePub
      SubnetId: !Ref SubnetPub2

  # Private Route Tables ------------------------------------------------------------
  RouteTablePvt1:
    Type: AWS::EC2::RouteTable
    DependsOn: VPC
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-rtb-pvt1

  RouteTablePvt1RouteA: #Internet traffic through NAT Gateway 1
    Type: AWS::EC2::Route
    DependsOn:
      - RouteTablePvt1
      - NatGateway1
    Properties:
      RouteTableId: !Ref RouteTablePvt1
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway1

  RouteTablePvt1Association2SubnetPvt1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    DependsOn:
      - RouteTablePvt1
      - SubnetPvt1
    Properties:
      RouteTableId: !Ref RouteTablePvt1
      SubnetId: !Ref SubnetPvt1

  RouteTablePvt2:
    Type: AWS::EC2::RouteTable
    DependsOn: VPC
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-rtb-pvt2

  RouteTablePvt2RouteA: #Internet traffic through NAT Gateway 2
    Type: AWS::EC2::Route
    DependsOn:
      - RouteTablePvt2
      - NatGateway2
    Properties:
      RouteTableId: !Ref RouteTablePvt2
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway2

  RouteTablePvt2Association2SubnetPvt2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    DependsOn:
      - RouteTablePvt2
      - SubnetPvt2
    Properties:
      RouteTableId: !Ref RouteTablePvt2
      SubnetId: !Ref SubnetPvt2

  # Public Network ACL --------------------------------------------------------------
  # See README for understanding choices creating inbound/outbound rules
  NetworkACLPub:
    Type: AWS::EC2::NetworkAcl
    DependsOn: VPC
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-nacl-pub

  NetworkACLPubInboundHTTP: #only when EnvType is Maintenance
    Type: AWS::EC2::NetworkAclEntry
    DependsOn: NetworkACLPub
    Condition: IsEnvMaintenance
    Properties:
       NetworkAclId: !Ref NetworkACLPub
       Egress: false
       RuleNumber: 100
       Protocol: 6  #IANA code or -1 for 'All' (6=TCP)
       RuleAction: allow
       CidrBlock: 0.0.0.0/0
       PortRange:
         From: 80
         To: 80

  NetworkACLPubInboundHTTPS: #mandatory
    Type: AWS::EC2::NetworkAclEntry
    DependsOn: NetworkACLPub
    Properties:
       NetworkAclId: !Ref NetworkACLPub
       Egress: false
       RuleNumber: 120
       Protocol: 6  #IANA code or -1 for 'All' (6=TCP)
       RuleAction: allow
       CidrBlock: 0.0.0.0/0
       PortRange:
         From: 443
         To: 443

  NetworkACLPubInboundSSH: #only when EnvType is Maintenance, and for Ip4ServerConnection only
    Type: AWS::EC2::NetworkAclEntry
    DependsOn: NetworkACLPub
    Condition: IsEnvMaintenance
    Properties:    
       NetworkAclId: !Ref NetworkACLPub
       Egress: false
       RuleNumber: 130
       Protocol: 6  #IANA code or -1 for 'All' (6=TCP)
       RuleAction: allow
       CidrBlock: !Ref Ip4ServerConnection
       PortRange:
         From: 22
         To: 22

  NetworkACLPubInboundEphemeral: #mandatory
    Type: AWS::EC2::NetworkAclEntry
    DependsOn: NetworkACLPub
    Properties:
       NetworkAclId: !Ref NetworkACLPub
       Egress: false
       RuleNumber: 140
       Protocol: 6  #IANA code or -1 for 'All' (6=TCP)
       RuleAction: allow
       CidrBlock: 0.0.0.0/0
       PortRange:
         From: 1024
         To: 65535

  NetworkACLPubOutboundHTTP: #only when EnvType is Maintenance
    Type: AWS::EC2::NetworkAclEntry
    DependsOn: NetworkACLPub
    Condition: IsEnvMaintenance
    Properties:
       NetworkAclId: !Ref NetworkACLPub
       Egress: true
       RuleNumber: 100
       Protocol: 6  #IANA code or -1 for 'All' (6=TCP)
       RuleAction: allow
       CidrBlock: 0.0.0.0/0
       PortRange:
         From: 80
         To: 80

  NetworkACLPubOutboundCustomHTTP: #mandatory
    Type: AWS::EC2::NetworkAclEntry
    DependsOn: NetworkACLPub
    Properties:
       NetworkAclId: !Ref NetworkACLPub
       Egress: true
       RuleNumber: 110
       Protocol: 6  #IANA code or -1 for 'All' (6=TCP)
       RuleAction: allow
       CidrBlock: 0.0.0.0/0
       PortRange:
         From: 8080
         To: 8080

  NetworkACLPubOutboundHTTPS: #mandatory
    Type: AWS::EC2::NetworkAclEntry
    DependsOn: NetworkACLPub
    Properties:
       NetworkAclId: !Ref NetworkACLPub
       Egress: true
       RuleNumber: 120
       Protocol: 6  #IANA code or -1 for 'All' (6=TCP)
       RuleAction: allow
       CidrBlock: 0.0.0.0/0
       PortRange:
         From: 443
         To: 443

  NetworkACLPubOutboundEphemeral: #mandatory
    Type: AWS::EC2::NetworkAclEntry
    DependsOn: NetworkACLPub
    Properties:
       NetworkAclId: !Ref NetworkACLPub
       Egress: true
       RuleNumber: 140
       Protocol: 6  #IANA code or -1 for 'All' (6=TCP)
       RuleAction: allow
       CidrBlock: 0.0.0.0/0
       PortRange:
         From: 1024
         To: 65535

  NetworkACLPubAssociation2SubnetPub1:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    DependsOn:
      - NetworkACLPub
      - SubnetPub1
    Properties: 
      NetworkAclId: !Ref NetworkACLPub
      SubnetId: !Ref SubnetPub1

  NetworkACLPubAssociation2SubnetPub2:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    DependsOn:
      - NetworkACLPub
      - SubnetPub2
    Properties: 
      NetworkAclId: !Ref NetworkACLPub
      SubnetId: !Ref SubnetPub2

  # Private Network ACL -------------------------------------------------------------
  # See README for understanding choices creating inbound/outbound rules
  NetworkACLPvt:
    Type: AWS::EC2::NetworkAcl
    DependsOn: VPC
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-nacl-pvt

  NetworkACLPvtInboundAllInt: #mandatory
    Type: AWS::EC2::NetworkAclEntry
    DependsOn: NetworkACLPvt
    Properties:
       NetworkAclId: !Ref NetworkACLPvt
       Egress: false
       RuleNumber: 100
       Protocol: -1  #IANA code or -1 for 'All'
       RuleAction: allow
       CidrBlock: !Ref VpcCIDR

  NetworkACLPvtInboundEphemeral: #mandatory
    Type: AWS::EC2::NetworkAclEntry
    DependsOn: NetworkACLPvt
    Properties:
       NetworkAclId: !Ref NetworkACLPvt
       Egress: false
       RuleNumber: 110
       Protocol: 6  #IANA code or -1 for 'All' (6=TCP)
       RuleAction: allow
       CidrBlock: 0.0.0.0/0
       PortRange:
         From: 1024
         To: 65535
      
  NetworkACLPvtOutboundAllInt: #mandatory
    Type: AWS::EC2::NetworkAclEntry
    DependsOn: NetworkACLPvt
    Properties:
       NetworkAclId: !Ref NetworkACLPvt
       Egress: true
       RuleNumber: 100
       Protocol: -1  #IANA code or -1 for 'All'
       RuleAction: allow
       CidrBlock: !Ref VpcCIDR

  NetworkACLPvtOutboundHTTP: #only when EnvType is Maintenance
    Type: AWS::EC2::NetworkAclEntry
    DependsOn: NetworkACLPvt
    Condition: IsEnvMaintenance
    Properties:
       NetworkAclId: !Ref NetworkACLPvt
       Egress: true
       RuleNumber: 110
       Protocol: 6  #IANA code or -1 for 'All' (6=TCP)
       RuleAction: allow
       CidrBlock: 0.0.0.0/0
       PortRange:
         From: 80
         To: 80

  NetworkACLPvtOutboundHTTPS: #mandatory
    Type: AWS::EC2::NetworkAclEntry
    DependsOn: NetworkACLPvt
    Properties:
       NetworkAclId: !Ref NetworkACLPvt
       Egress: true
       RuleNumber: 120
       Protocol: 6  #IANA code or -1 for 'All' (6=TCP)
       RuleAction: allow
       CidrBlock: 0.0.0.0/0
       PortRange:
         From: 443
         To: 443

  NetworkACLPvtAssociation2SubnetPvt1:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    DependsOn:
      - NetworkACLPvt
      - SubnetPvt1
    Properties: 
      NetworkAclId: !Ref NetworkACLPvt
      SubnetId: !Ref SubnetPvt1

  NetworkACLPvtAssociation2SubnetPvt2:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    DependsOn:
      - NetworkACLPvt
      - SubnetPvt2
    Properties: 
      NetworkAclId: !Ref NetworkACLPvt
      SubnetId: !Ref SubnetPvt2

  # Security Group 4 private ECS ----------------------------------------------------
  SecGroup4PvtECS:
    Type: AWS::EC2::SecurityGroup
    DependsOn: VPC
    Properties:
      GroupName: !Sub ${EnvironmentName}-pvtecs-sg
      GroupDescription: "Security group for private ECS"
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-sg-pvtecs

  SecGroup4PvtECSInboundAllInt: #Allow all internal VPC traffic
    Type: AWS::EC2::SecurityGroupIngress
    DependsOn: SecGroup4PvtECS
    Properties:
      GroupId: !Ref SecGroup4PvtECS
      Description: "All VPC internal traffic"
      IpProtocol: -1
      CidrIp: !Ref VpcCIDR

  # Security Group 4 ECS ELB --------------------------------------------------------
  SecGroup4EcsELB:
    Type: AWS::EC2::SecurityGroup
    DependsOn: VPC
    Properties:
      GroupName: !Sub ${EnvironmentName}-pvtelb-ecs-sg
      GroupDescription: "Security group for ECS load balancer"
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-sg-pvtelb-ecs

  SecGroup4EcsELBInbound8080: #For listener 8080
    Type: AWS::EC2::SecurityGroupIngress
    DependsOn: SecGroup4EcsELB
    Properties:
      GroupId: !Ref SecGroup4EcsELB
      Description: "All traffic for TCP 8080"
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      CidrIp: !Ref VpcCIDR
  ####################################################################################

  # ECR/ECS ##########################################################################
  # ECR private repo ----------------------------------------------------------------
  ECR:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub ${EnvironmentName}/${ContainerName}
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-ecr

  # ECS cluster ----------------------------------------------------------------------
  ECScluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${EnvironmentName}-cluster
      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-cluster

  # ECS Task Definition with roles ---------------------------------------------------
  ECSTaskDefinitionIAMTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub ECS Task Execution role for ${EnvironmentName}
      RoleName: !Sub ${EnvironmentName}-ecs-taskexecution-role
      Path: /
      AssumeRolePolicyDocument:
        Version: 2008-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: !Sub ${EnvironmentName}-ecscreateloggroup-policy #allows creation of CloudWatch log group (awslogs-create-group in ECSTaskDefinition)
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              #Resource has to be exactly the same name of awslogs-group in ECSTaskDefinition
              - Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/${EnvironmentName}-taskdefinition:*
                Action:
                  - logs:CreateLogGroup
                Effect: Allow

  ECSTaskDefinitionIAMTaskRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub ECS Task role for ${EnvironmentName}
      RoleName: !Sub ${EnvironmentName}-ecs-task-role
      Path: /
      AssumeRolePolicyDocument:
        Version: 2008-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole
            # Condition:
              # StringEquals: !Sub aws:SourceAccount: ${AWS::AccountId}
              # ArnLike: !Sub aws:SourceArn: arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*
      Policies:
        - PolicyName: !Sub ${EnvironmentName}-ecsExec-policy #allows to use ECS Exec in containers (aws ecs execute-command, useful for debugging)
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Resource: "*"
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Effect: Allow

  ECSTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    DependsOn:
      - ECR
      - ECSTaskDefinitionIAMTaskExecutionRole
      - ECSTaskDefinitionIAMTaskRole
    Properties:
      Family: !Sub ${EnvironmentName}-taskdefinition #name
      #Launch type -------------------------
      RequiresCompatibilities: 
        - FARGATE
      #OS, Architecture, Network mode ------
      RuntimePlatform: 
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64
      NetworkMode: awsvpc
      #Task size ----------------------------
      Memory: 1024 #1GB
      Cpu: 512 #0.5 CPU
      #Task roles ---------------------------
      TaskRoleArn: !GetAtt ECSTaskDefinitionIAMTaskRole.Arn
      ExecutionRoleArn:  !GetAtt ECSTaskDefinitionIAMTaskExecutionRole.Arn
      #Containers ---------------------------
      ContainerDefinitions:
        #container 1, with the rest api, the only one in this project
        - Name: !Ref ContainerName
          Essential: true
          Image: !Sub ${ECR.RepositoryUri}:latest
          PortMappings:
            - Name: "port8080"
              ContainerPort: 8080
              Protocol: tcp
              AppProtocol: http
            - Name: "port80"
              ContainerPort: 80
              Protocol: tcp
              AppProtocol: http
          Environment: #Env variables
            - Name: HOSTNAME  #ECS injects/overrides HOSTNAME with something else, so it has to be reset; otherwise healthchecks do not work
              Value: 0.0.0.0
          HealthCheck:
              Command:
                - CMD-SHELL #run the command with the container's default shell
                - curl -v http://127.0.0.1:8080/api || exit 1 #success expected from GET /api (it must be localhost)
              StartPeriod: 45 #grace period to allow containers to bootstrap before start health checks
              Interval: 30 #seconds between each health check execution
              Timeout: 5 #seconds to wait for a health check to succeed before it is considered a failure
              Retries: 3 #number of retries to a failed check before the container is considered unhealthy
          ReadonlyRootFilesystem: false #if true, doesn't support ECS Exec
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Sub /ecs/${EnvironmentName}-taskdefinition #exactly the same name in ECSTaskDefinitionIAMTaskExecutionRole
              awslogs-create-group: true
              awslogs-region: us-east-1
              awslogs-stream-prefix: ecs
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-taskdefinition

  # ECS Service ----------------------------------------------------------------------
  ECSService:
    Type: AWS::ECS::Service
    DependsOn:
      - ECScluster
      - ECSTaskDefinition
      - SubnetPvt1
      - SubnetPvt2
      - SecGroup4PvtECS
      - ELBListenerHTTP #prevents the service from starting before the listener is ready
    Properties:
      ServiceName: !Sub ${EnvironmentName}-service
      TaskDefinition: !Sub ${EnvironmentName}-taskdefinition #CFn for Task definition doesn't return family, use the same value in both
      Cluster: !GetAtt ECScluster.Arn
      #Compute ------------------------
      LaunchType: FARGATE
      PlatformVersion: LATEST
      #Troubleshooting (ECS Exec) -----
      EnableExecuteCommand: true
      #Deployment ------------------------
      DesiredCount: 0 #Stack doesn't complete until qty of tasks are running; ECR image is not available for a while, so change to 1 manually after pipeline 
      #Network ------------------------
      NetworkConfiguration:
        AwsvpcConfiguration:
            AssignPublicIp: DISABLED #because service is settled in SubnetPvt1/SubnetPvt2
            SecurityGroups: 
              - !Ref SecGroup4PvtECS
            Subnets:
              - !Ref SubnetPvt1
              - !Ref SubnetPvt2
      LoadBalancers:
        - ContainerName: !Ref ContainerName
          ContainerPort: 8080
          LoadBalancerName: !Ref AWS::NoValue #Name is not specified for ALBs
          TargetGroupArn: !Ref ELBTargetGroup
      AvailabilityZoneRebalancing: ENABLED
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-service
  # ELB for ECS Service --------------------------------------------------------------
  ELB: #application load balancer
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: 
      - SecGroup4EcsELB
      - SubnetPvt1
      - SubnetPvt2
    Properties: 
      IpAddressType: ipv4
      Name: !Sub ${EnvironmentName}-ecs-ldblncr
      Type: application
      Scheme: internal #private
      SecurityGroups:
        - !Ref SecGroup4EcsELB
      Subnets: 
        - !Ref SubnetPvt1
        - !Ref SubnetPvt2
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-ecs-ldblncr

  ELBListenerHTTP:
    Type: AWS::ElasticLoadBalancingV2::Listener
    DependsOn:
      - ELB
      - ELBTargetGroup
    Properties:
      LoadBalancerArn: !Ref ELB
      DefaultActions:
        - Type: forward
          ForwardConfig:
            TargetGroups:
              - TargetGroupArn: !Ref ELBTargetGroup
                Weight: 1
      Port: 8080
      Protocol: HTTP
  
  ELBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    DependsOn:
     - VPC
    Properties: 
      Name: !Sub ${EnvironmentName}-ldblncr-tgtgrp
      TargetType: ip
      VpcId: !Ref VPC
      Port: 8080
      Protocol: HTTP
      ProtocolVersion: HTTP1
      HealthCheckPath: "/api"
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: 200
      HealthCheckIntervalSeconds: 15 #seconds between health checks
      HealthCheckTimeoutSeconds: 5 #amount of seconds during which no response means a failed check
      UnhealthyThresholdCount: 2 #number of consecutive checks failing before a healthy target becomes unhealthy
      HealthyThresholdCount: 2 #number of consecutive checks succeeding before an unhealthy target becomes healthy
      Tags: 
        - Key: Name
          Value: !Sub ${EnvironmentName}-ldblncr-tgtgrp
  ####################################################################################

  # CI/CD Pipeline ###################################################################
  # Artifact storage ---------------------------------------------------------------
  S3Bucket4PipelineArtifacts:
    Type: AWS::S3::Bucket
    Properties:
      AccessControl: Private
      # BucketName: !Sub ${EnvironmentName}-bucket-artifacts #Comment for auto-generated name
      VersioningConfiguration:
        Status: Enabled #must be enabled to work as artifact for CodePipeline
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-bucket-artifacts

  # EventBridge to connect artifact events to pipeline -----------------------------
  EventBridge4CodePipelineS3TriggerIAMRole:
    Type: AWS::IAM::Role
    DependsOn:
      - CodePipeline
    Properties:
      Description: !Sub EventBridge rule for ${EnvironmentName} to scan S3 bucket artifacts as input to codepipeline
      RoleName: !Sub ${EnvironmentName}-eventbridge-codepipeline-role
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - events.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: !Sub ${EnvironmentName}-eventbridge-codepipeline-policy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Resource:
                  - !GetAtt CodePipeline.Arn
                Action:
                  - codepipeline:StartPipelineExecution

  EventBridge4CodePipelineS3TriggerCloudTrailBucket: #Trail buckets for logs
    Type: AWS::S3::Bucket
    Properties:
      AccessControl: Private
      # BucketName: !Sub ${EnvironmentName}-bucket-cloudtrail #Comment for auto-generated name
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-bucket-cloudtrail

  EventBridge4CodePipelineS3TriggerCloudTrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DependsOn:
      - EventBridge4CodePipelineS3TriggerCloudTrailBucket
      # - EventBridge4CodePipelineS3TriggerCloudTrail #CloudTrail cannot be created if policy not in place; so the policy dropped conditions over trail arn
    Properties:
      Bucket: !Ref EventBridge4CodePipelineS3TriggerCloudTrailBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt EventBridge4CodePipelineS3TriggerCloudTrailBucket.Arn
            # Condition:
              # StringEquals:
                # AWS:SourceArn: !GetAtt EventBridge4CodePipelineS3TriggerCloudTrail.Arn #"arn:aws:cloudtrail:us-east-1:629066559673:trail/testetrail"
          - Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub ${EventBridge4CodePipelineS3TriggerCloudTrailBucket.Arn}/* #cloudtrail/AWSLogs/${AWS::AccountId}/*
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                # #AWS:SourceArn: !GetAtt EventBridge4CodePipelineS3TriggerCloudTrail.Arn #"arn:aws:cloudtrail:us-east-1:629066559673:trail/testetrail"

  EventBridge4CodePipelineS3TriggerCloudTrail: #Trail to enable object-level data logging events for S3, allowing eventbridge rule to capture them
    Type: AWS::CloudTrail::Trail
    DependsOn:
      - S3Bucket4PipelineArtifacts
      - EventBridge4CodePipelineS3TriggerCloudTrailBucket
      - EventBridge4CodePipelineS3TriggerCloudTrailBucketPolicy
    Properties:
      TrailName: !Sub ${EnvironmentName}-trail-codepipeline-bucketartifacts
      IsMultiRegionTrail: false
      IsOrganizationTrail: false
      S3BucketName: !Ref EventBridge4CodePipelineS3TriggerCloudTrailBucket
      S3KeyPrefix: cloudtrail
      IsLogging: true
      EventSelectors:
        - IncludeManagementEvents: false
          DataResources:
            - Values:
              - !Sub arn:aws:s3:::${S3Bucket4PipelineArtifacts}/${SourceCodeS3Key}
              Type: AWS::S3::Object
          ReadWriteType: WriteOnly
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-trail-codepipeline-bucketartifacts

  EventBridge4CodePipelineS3Trigger:
    Type: AWS::Events::Rule
    DependsOn:
      - S3Bucket4PipelineArtifacts
      - EventBridge4CodePipelineS3TriggerIAMRole
    Properties:
      Description: !Sub EventBridge Rule for ${EnvironmentName} to automatically start pipeline when a change occurs in the S3 object key
      Name: !Sub ${EnvironmentName}-eventbridge-rule-artifactbucket
      State: ENABLED
      EventBusName: default
      EventPattern:
        Fn::ToJsonString:
          source:
            - aws.s3
          detail-type:
            - "AWS API Call via CloudTrail"
          detail:
            eventSource:
              - s3.amazonaws.com
            eventName:
              - PutObject
              - CompleteMultipartUpload
              - CopyObject
            requestParameters:
              bucketName:
                - !Ref S3Bucket4PipelineArtifacts
              key:
                - !Ref SourceCodeS3Key
      Targets:
        - Arn: !GetAtt CodePipeline.Arn
          Id: 8eaa010c-b205-45a4-a668-fee99d6673fe #generate ID and paste it here
          RoleArn: !GetAtt EventBridge4CodePipelineS3TriggerIAMRole.Arn
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-eventbridge-rule

  # CodePipeline for app/container --------------------------------------------------
  CodePipelineIAMRole:
    Type: AWS::IAM::Role
    DependsOn:
      - S3Bucket4PipelineArtifacts
      - CodeBuild
      - ECSTaskDefinitionIAMTaskExecutionRole
      - ECSTaskDefinitionIAMTaskRole
    Properties:
      Description: !Sub CodePipeline role for ${EnvironmentName} build and deploy of container with rest api
      RoleName: !Sub ${EnvironmentName}-codepipeline-role
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - codepipeline.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: !Sub ${EnvironmentName}-codepipeline-policy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow #Source stage
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${S3Bucket4PipelineArtifacts}
                  - !Sub arn:${AWS::Partition}:s3:::${S3Bucket4PipelineArtifacts}/*
                Action:
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:GetObjectTagging
                  - s3:GetObjectVersionTagging
                  - s3:ListBucket
                  - s3:PutObject
                  - s3:PutObjectAcl
                  - s3:PutObjectTagging
                  - s3:GetBucketPolicy
                  - s3:GetBucketVersioning
                  - s3:GetBucketAcl
                  - s3:GetBucketLocation
              - Effect: Allow #BuildStage
                Resource:
                  - !Sub arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:project/${CodeBuild}
                  - !Sub arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:build/${CodeBuild}:*
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
              - Effect: Allow #DeployStage, Task Definition and Service
                Resource:
                  - "*"
                Action:
                  - ecs:DescribeServices
                  - ecs:DescribeTaskDefinition
                  - ecs:DescribeTasks
                  - ecs:ListTasks
                  - ecs:RegisterTaskDefinition
                  - ecs:UpdateService
                  - ecs:TagResource
              - Effect: Allow #DeployStage, IAM Pass Role
                Resource:
                  - !GetAtt ECSTaskDefinitionIAMTaskExecutionRole.Arn
                  - !GetAtt ECSTaskDefinitionIAMTaskRole.Arn
                Action:
                  - iam:PassRole
                Condition:
                  StringEqualsIfExists:
                    iam:PassedToService:
                      - ecs-tasks.amazonaws.com
                      - ecs.amazonaws.com
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-codepipeline-role

  CodePipeline:
    Type: AWS::CodePipeline::Pipeline
    DependsOn:
      - CodePipelineIAMRole
      - S3Bucket4PipelineArtifacts
      - CodeBuild
      - ECScluster
      - ECSService
    Properties:
      Name: !Sub ${EnvironmentName}-bcknd-pipeline
      RoleArn: !GetAtt CodePipelineIAMRole.Arn
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-bcknd-pipeline
      ArtifactStore: 
        Type: S3
        Location: !Ref S3Bucket4PipelineArtifacts
      RestartExecutionOnUpdate: true
      Stages:
        - Name: SourceStage
          Actions:
            - Name: BackendSourceS3
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: S3
                Version: 1
              Configuration:
                S3Bucket: !Ref S3Bucket4PipelineArtifacts
                S3ObjectKey: !Sub ${SourceCodeS3Key}
                PollForSourceChanges: false
              OutputArtifacts:
                - Name: BackendSourceS3Artifacts
        - Name: BuildStage
          Actions:
            - Name: BackendBuild
              InputArtifacts: 
                - Name: BackendSourceS3Artifacts 
              ActionTypeId: 
                Category: Build 
                Owner: AWS
                Provider: CodeBuild
                Version: 1
              Configuration:
                ProjectName: !Ref CodeBuild
              OutputArtifacts: 
                - Name: BackendCodeBuildArtifacts
        - Name: DeployStage
          Actions:
            - Name: BackendDeploy
              InputArtifacts: 
                - Name: BackendCodeBuildArtifacts 
              ActionTypeId: 
                Category: Deploy 
                Owner: AWS
                Provider: ECS
                Version: 1
              Configuration:
                ClusterName: !Ref ECScluster
                ServiceName: !Ref ECSService
                FileName: imagedefinitions.json #same name specified within CodeBuild's buildspec.yml, in artifacts/files

  # CodeBuild for app/container -----------------------------------------------------
  CodeBuildIAMRole:
    Type: AWS::IAM::Role
    DependsOn:
      - S3Bucket4PipelineArtifacts
      - ECR
    Properties:
      Description: !Sub CodeBuild role for ${EnvironmentName} api and container deploys
      RoleName: !Sub ${EnvironmentName}-codebuild-role
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - codebuild.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /service-role/
      Policies:
        - PolicyName: !Sub ${EnvironmentName}-codebuild-policy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${EnvironmentName}-bcknd-cbld
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${EnvironmentName}-bcknd-cbld:*
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
              - Effect: Allow
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::codepipeline-${AWS::Region}-*
                  - !Sub arn:${AWS::Partition}:s3:::${S3Bucket4PipelineArtifacts}
                  - !Sub arn:${AWS::Partition}:s3:::${S3Bucket4PipelineArtifacts}/*
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:GetBucketAcl
                  - s3:GetBucketLocation
              - Effect: Allow
                Resource:
                  - "*"
                Action:
                  - ecr:GetAuthorizationToken
              - Effect: Allow
                Resource:
                  - !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ECR}
                Action:
                  - imagebuilder:GetComponent
                  - imagebuilder:GetContainerRecipe
                  - ecr:BatchGetImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:PutImage
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-codebuild-role

  CodeBuild:
    Type: AWS::CodeBuild::Project
    DependsOn:
      - CodeBuildIAMRole
    Properties: 
      Description: !Sub Build of rest api and docker image for ${EnvironmentName}
      Name: !Sub ${EnvironmentName}-bcknd-cbld #Always exactly same name configured inside CodeBuildIAMRole
      ServiceRole: !GetAtt CodeBuildIAMRole.Arn
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-bcknd-cbld
      Artifacts:
        Type: CODEPIPELINE
      ConcurrentBuildLimit: 1
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:8.0 #UBUNTU
        Type: LINUX_CONTAINER
        EnvironmentVariables:
          - Name: ECR_URI
            Value: !GetAtt ECR.RepositoryUri
            Type: PLAINTEXT
          - Name: ECS_CONTAINER_NAME
            Value: !Ref ContainerName
            Type: PLAINTEXT
      LogsConfig: 
        CloudWatchLogs:
          Status: ENABLED
      Source: 
        GitCloneDepth: 1
        Type: CODEPIPELINE
      TimeoutInMinutes: 10
  ####################################################################################

#----------------------------------------------------------------------
#Output information for user after stack creation
#----------------------------------------------------------------------
Outputs:
  EnvironmentType:
    Description: Type of environment of stack
    Value: !Ref EnvType

  EnvironmentName:
    Description: Environment Name
    Value: !Ref EnvironmentName

  S3Bucket4PipelineArtifacts:
    Description: S3 Artifacts Bucket to upload source code
    Value: !Ref S3Bucket4PipelineArtifacts

  ECR:
    Description: ECR repo
    Value: !Ref ECR

  ECScluster:
    Description: ECS cluster
    Value: !Ref ECScluster

  ELB:
    Description: DNS of ECS ELB to call API
    Value: !GetAtt ELB.DNSName
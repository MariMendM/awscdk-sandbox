#----------------------------------------------------------------------
Description:
 Contains
 1 Bedrock AgentCore Runtime
 1 Bedrock AgentCore Memory
 1 Bedrock AgentCore Endpoint
 2 IAM roles (Runtime, Memory)

#----------------------------------------------------------------------
#Input parameters ( injected from CodePipeline deployment targeting this stack)
#----------------------------------------------------------------------
Parameters:

  EnvironmentName:
    Description: Environment name injected by CodePipeline from cloudformation-pipeline.yml
    Type: String

  AgentName:
    Description: Agent name injected by CodePipeline from cloudformation-pipeline.yml
    Type: String

  ContainerImageUri:
    Description: ECR container image URI injected by CodePipeline from cloudformation-pipeline.yml
    Type: String

  ECRRepositoryArn:
    Description: ECR repository ARN injected by CodePipeline from cloudformation-pipeline.yml
    Type: String

  ECRRepositoryEncryptionKeyArn:
    Description: ECR repository Encryption Key ARN injected by CodePipeline from cloudformation-pipeline.yml
    Type: String

#----------------------------------------------------------------------
#Resources definition
#----------------------------------------------------------------------
Resources:

  # Bedrock runtime/memory/endpoint ##################################################
  BedrockAgentMemoryIAMServiceRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub Bedrock agent memory service role for ${EnvironmentName}
      RoleName: !Sub ${EnvironmentName}-agentmemory-service-role
      Path: !Sub /${EnvironmentName}/
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
        - Action: sts:AssumeRole
          Condition:
            StringEquals:
              aws:SourceAccount: !Sub ${AWS::AccountId}
            ArnLike:
              aws:SourceArn: !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:memory/${EnvironmentName}_agentMemory*
          Effect: Allow
          Principal:
            Service: bedrock-agentcore.amazonaws.com

  BedrockAgentMemory:
    Type: AWS::BedrockAgentCore::Memory
    DependsOn:
      - BedrockAgentMemoryIAMServiceRole
    Properties:
      EventExpiryDuration: 30
      Name: !Sub ${EnvironmentName}_agentMemory #Always exactly same name configured inside BedrockAgentMemoryIAMServiceRole
      MemoryExecutionRoleArn: !GetAtt BedrockAgentMemoryIAMServiceRole.Arn
      MemoryStrategies:
      - SemanticMemoryStrategy:
          Name: !Sub ${EnvironmentName}_agentMemory_Semantic
          NamespaceTemplates:
          - "/users/{actorId}/facts"
      - EpisodicMemoryStrategy:
          Name: !Sub ${EnvironmentName}_agentMemory_Episodic
          NamespaceTemplates:
          - "/episodes/{actorId}/{sessionId}"
          ReflectionConfiguration:
            NamespaceTemplates:
            - "/episodes/{actorId}"

  BedrockAgentCoreRuntimeIAMExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub Execution role for Bedrock Agent Core Runtime ${EnvironmentName}
      RoleName: !Sub ${EnvironmentName}-agentcoreruntime-role
      Path: !Sub /${EnvironmentName}/
      MaxSessionDuration: 28800
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
        - Action: sts:AssumeRole
          Condition:
            StringEquals:
              aws:SourceAccount: !Sub ${AWS::AccountId}
            ArnLike:
              aws:SourceArn: !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/${EnvironmentName}_${AgentName}*
          Effect: Allow
          Principal:
            Service: bedrock-agentcore.amazonaws.com
      Policies:
        - PolicyName: !Sub ${EnvironmentName}-agentcoreruntime-policy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
            - Action:
              - logs:CreateLogGroup
              - logs:DescribeLogStreams
              Effect: Allow
              Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*
              Sid: LogGroupAccess
            - Action: logs:DescribeLogGroups
              Effect: Allow
              Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*
              Sid: DescribeLogGroups
            - Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
              Effect: Allow
              Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*:log-stream:*
              Sid: LogStreamAccess
            - Action:
              - xray:GetSamplingRules
              - xray:GetSamplingTargets
              - xray:PutTelemetryRecords
              - xray:PutTraceSegments
              Effect: Allow
              Resource:
              - "*"
              Sid: XRayAccess
            - Action: cloudwatch:PutMetricData
              Condition:
                StringEquals:
                  cloudwatch:namespace: bedrock-agentcore
              Effect: Allow
              Resource:
              - "*"
              Sid: CloudWatchMetrics
            - Action:
              - bedrock-agentcore:GetWorkloadAccessToken
              - bedrock-agentcore:GetWorkloadAccessTokenForJWT
              - bedrock-agentcore:GetWorkloadAccessTokenForUserId
              Effect: Allow
              Resource:
              - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default
              - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default/workload-identity/*
              Sid: GetAgentAccessToken
            - Action:
              - bedrock:CountTokens
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
              Effect: Allow
              Resource:
              - !Sub arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*
              - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/*
            - Action:
              - logs:FilterLogEvents
              - logs:GetLogEvents
              - logs:PutResourcePolicy
              Effect: Allow
              Resource:
              - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*
            - Action:
              - bedrock-agentcore:CreateConfigurationBundle
              - bedrock-agentcore:DeleteConfigurationBundle
              - bedrock-agentcore:GetConfigurationBundle
              - bedrock-agentcore:GetConfigurationBundleVersion
              - bedrock-agentcore:ListConfigurationBundleVersions
              - bedrock-agentcore:ListConfigurationBundles
              - bedrock-agentcore:UpdateConfigurationBundle
              Effect: Allow
              Resource:
              - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:configuration-bundle/*
            - Action: ecr:GetAuthorizationToken
              Effect: Allow
              Resource: "*"
            - Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
              Effect: Allow
              Resource: !Sub ${ECRRepositoryArn}
            - Action: kms:Decrypt
              Effect: Allow
              Resource: !Sub ${ECRRepositoryEncryptionKeyArn}
            - Action:
              - bedrock-agentcore:ListMemoryRecords
              - bedrock-agentcore:RetrieveMemoryRecords
              Condition:
                StringLike:
                  bedrock-agentcore:namespace:
                  - /users/*/facts
                  - /episodes/*/*
              Effect: Allow
              Resource: !GetAtt BedrockAgentMemory.MemoryArn
            - Action:
              - bedrock-agentcore:ListMemoryRecords
              - bedrock-agentcore:RetrieveMemoryRecords
              Condition:
                StringLike:
                  bedrock-agentcore:namespacePath:
                  - /users/*/facts
                  - /episodes/*/*
              Effect: Allow
              Resource:
              - !GetAtt BedrockAgentMemory.MemoryArn
            - Action:
              - bedrock-agentcore:CreateEvent
              - bedrock-agentcore:DeleteEvent
              - bedrock-agentcore:DeleteMemoryRecord
              - bedrock-agentcore:GetEvent
              - bedrock-agentcore:GetMemory
              - bedrock-agentcore:GetMemoryRecord
              - bedrock-agentcore:ListActors
              - bedrock-agentcore:ListEvents
              - bedrock-agentcore:ListSessions
              Effect: Allow
              Resource:
              - !GetAtt BedrockAgentMemory.MemoryArn

  BedrockAgentCoreRuntime:
    #Automatically creates a DEFAULT endpoint pointing to V1 upon creation, automatically updating to target the latest version when runtime is updated
    Type: AWS::BedrockAgentCore::Runtime
    DependsOn:
      - BedrockAgentCoreRuntimeIAMExecutionRole
      - BedrockAgentMemory
    Properties:
      AgentRuntimeName: !Sub ${EnvironmentName}_${AgentName}
      Description: !Sub AgentCore Runtime for ${EnvironmentName} ${AgentName}
      AgentRuntimeArtifact:
        ContainerConfiguration:
          ContainerUri: !Sub ${ContainerImageUri}
      EnvironmentVariables:
        MEMORY_AGENTMEMORY_ID: !GetAtt BedrockAgentMemory.MemoryId
        MEMORY_AGENTMEMORY_ARN: !GetAtt BedrockAgentMemory.MemoryArn
      LifecycleConfiguration: {}
      NetworkConfiguration:
        NetworkMode: PUBLIC
      ProtocolConfiguration: HTTP
      RoleArn: !GetAtt BedrockAgentCoreRuntimeIAMExecutionRole.Arn

  # BedrockAgentCoreRuntimeEndpoint:
    # Type: AWS::BedrockAgentCore::RuntimeEndpoint
    # DependsOn:
      # - BedrockAgentCoreRuntime
    # Properties:
      # Description: !Sub AgentCore Runtime Endpoint for ${EnvironmentName} ${AgentName}
      # Name: !Sub ${EnvironmentName}_${AgentName}
      # AgentRuntimeId: !GetAtt BedrockAgentCoreRuntime.AgentRuntimeId
  ####################################################################################

#----------------------------------------------------------------------
#Output information for user after stack creation
#----------------------------------------------------------------------
Outputs:

  BedrockAgentCoreRuntimeArn:
    Description: Runtime ARN for Bedrock AgentCore
    Value: !GetAtt BedrockAgentCoreRuntime.AgentRuntimeArn

  BedrockAgentMemoryArn:
    Description: Memory ARN for Bedrock AgentCore
    Value: !GetAtt BedrockAgentMemory.MemoryArn

  # BedrockAgentCoreRuntimeEndpoint:
    # Description: Endpoint ARN for Bedrock AgentCore
    # Value: !GetAtt BedrockAgentCoreRuntimeEndpoint.AgentRuntimeEndpointArn